name: Diagnose session checks

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read session diagnostics via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 3m
          script_stop: false
          script: |
            set -e
            docker ps --format '{{.Names}} {{.Status}}' --filter name=acca
            docker logs --since 30m --tail 3000 acca-web 2>&1 | docker exec -i acca-web node -e '
              let logs = "";
              process.stdin.on("data", chunk => logs += chunk);
              process.stdin.on("end", () => {
                const lines = logs.split("\n");
                const markers = ["[auth/me]", "Error in /api/auth/me:", "nestFetchAsUser /access/me", "ECONNREFUSED", "ETIMEDOUT", "ENOTFOUND", "fetch failed", "P2024", "P1001", "P1002"];
                for (const marker of markers) console.log(JSON.stringify({ marker, count: lines.filter(line => line.includes(marker)).length }));
                const statuses = {};
                for (const line of lines.filter(line => line.includes("[auth/me]"))) {
                  const status = line.match(/status: (\d+)/)?.[1] || "unknown";
                  statuses[status] = (statuses[status] || 0) + 1;
                }
                console.log(JSON.stringify({ sessionFailureStatuses: statuses }));
              });'
            docker exec acca-web node -e '
              (async () => {
                const base = process.env.NEXT_PUBLIC_NEST_API_URL || "http://127.0.0.1:3007/api";
                const target = new URL(base);
                console.log(JSON.stringify({ backendHost: target.hostname, backendPort: target.port, jwtSecretConfigured: Boolean(process.env.JWT_SECRET) }));
                for (let attempt = 1; attempt <= 3; attempt++) {
                  const started = Date.now();
                  try {
                    const response = await fetch(base + "/access/me", { signal: AbortSignal.timeout(10000) });
                    console.log(JSON.stringify({ probe: attempt, status: response.status, durationMs: Date.now() - started }));
                  } catch (error) {
                    console.log(JSON.stringify({ probe: attempt, error: error.name, code: error.cause?.code, durationMs: Date.now() - started }));
                  }
                }
              })();'
            docker logs --since 30m --tail 3000 acca-api 2>&1 | docker exec -i acca-web node -e '
              let logs = "";
              process.stdin.on("data", chunk => logs += chunk);
              process.stdin.on("end", () => {
                for (const marker of ["/api/access/me", "P2024", "P1001", "P1002", "Too many connections", "Timed out", "ECONNREFUSED"]) {
                  const lines = logs.split("\n").filter(line => line.includes(marker));
                  const statuses = {};
                  for (const line of lines) {
                    const status = line.match(/Status: (\d+)/)?.[1];
                    if (status) statuses[status] = (statuses[status] || 0) + 1;
                  }
                  console.log(JSON.stringify({ apiMarker: marker, count: lines.length, statuses }));
                }
              });'
