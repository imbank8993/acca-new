name: Build & Deploy ACCA via Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ── 1. Verifikasi Build & Typecheck di GitHub Runner ────────────────────────
  verify:
    name: Verify Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy?schema=public"
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Typecheck Frontend (Next.js)
        run: npm run typecheck

      - name: Build Backend (NestJS)
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy?schema=public"
        run: npm run build:backend

  # ── 2. Otomatis Deploy ke VPS via SSH ───────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: verify
    runs-on: ubuntu-latest
    # Hanya dijalankan jika VPS_HOST disetel di GitHub Repository Secrets
    if: "${{ secrets.VPS_HOST != '' }}"
    steps:
      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "=================================================="
            echo "🚀 Menghubungkan ke VPS..."
            echo "=================================================="
            
            APP_DIR="${{ secrets.VPS_APP_DIR || '~/acca-new' }}"
            cd $APP_DIR || { echo "❌ Folder $APP_DIR tidak ditemukan di VPS!"; exit 1; }
            
            echo "📥 [1/3] Mengambil commit terbaru dari branch main..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "🐳 [2/3] Membangun dan merestart kontainer Docker..."
            if docker compose version &> /dev/null; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi
            
            $DC up -d --build --remove-orphans
            
            echo "🧹 [3/3] Membersihkan Docker image lama yang tidak terpakai..."
            docker image prune -f
            
            echo "=================================================="
            echo "✅ Deployment Sukses!"
            echo "=================================================="
            $DC ps
