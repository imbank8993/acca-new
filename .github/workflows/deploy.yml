name: Auto Deploy ACCA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_TOKEN: ${{ github.token }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 60m
          script_stop: true
          envs: DEPLOY_TOKEN,DEPLOY_REPOSITORY,DEPLOY_SHA
          script: |
            set -eu
            set +x
            cd /www/wwwroot/acca-new

            echo "📥 Pull kode terbaru..."
            : "${DEPLOY_TOKEN:?Token deployment belum tersedia}"
            : "${DEPLOY_REPOSITORY:?Repository deployment belum tersedia}"
            : "${DEPLOY_SHA:?Commit deployment belum tersedia}"
            export GIT_TERMINAL_PROMPT=0
            # Temporary process configuration; never write the token to origin/config.
            export GIT_CONFIG_COUNT=3
            export GIT_CONFIG_KEY_0=credential.helper
            export GIT_CONFIG_VALUE_0=''
            export GIT_CONFIG_KEY_1=http.https://github.com/.extraheader
            export GIT_CONFIG_VALUE_1=''
            export GIT_CONFIG_KEY_2=http.https://github.com/.extraheader
            export GIT_CONFIG_VALUE_2="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DEPLOY_TOKEN" | base64 | tr -d '\n')"
            git fetch --no-tags "https://github.com/${DEPLOY_REPOSITORY}.git" "$DEPLOY_SHA"
            git reset --hard "$DEPLOY_SHA"
            unset DEPLOY_TOKEN GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GIT_CONFIG_KEY_1 GIT_CONFIG_VALUE_1 GIT_CONFIG_KEY_2 GIT_CONFIG_VALUE_2

            echo "🐳 Build Docker..."
            docker compose build

            echo "🗄️ Siapkan migrasi database sebelum aplikasi baru aktif..."
            docker compose run --rm --no-deps acca-api node node_modules/prisma/build/index.js db execute --schema apps/api/prisma/schema.prisma --file apps/api/prisma/sql/20261013_agenda_sasaran.sql
            docker compose run --rm --no-deps acca-api node node_modules/prisma/build/index.js db execute --schema apps/api/prisma/schema.prisma --file apps/api/prisma/sql/20261016_e_sertifikat.sql

            echo "🔄 Restart aplikasi..."
            docker compose up -d --remove-orphans

            echo "🧹 Bersihkan image lama..."
            docker image prune -f

            echo "🧹 Bersihkan Nginx Proxy Cache & reload Nginx..."
            rm -rf /www/server/nginx/proxy_cache_dir/* 2>/dev/null || true
            nginx -s reload 2>/dev/null || systemctl reload nginx 2>/dev/null || true

            echo "✅ Deploy selesai!"
            docker compose ps
