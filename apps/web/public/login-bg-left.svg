<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="1000" height="1200" preserveAspectRatio="xMidYMid slice">
  <!--
    Langit malam untuk panel kiri halaman login (dark mode).
    Digenerate oleh scripts/gen-nightsky.js - jangan diedit manual.
    Warna dasar panel dipasang lewat CSS (.dark .lp-brand); file ini hanya
    berisi nebula, bima sakti, bintang, dan planet jauh.
  -->
  <defs>
    <radialGradient id="skNebulaA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E5BD6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1E5BD6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skNebulaB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DBCFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2DBCFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skHorizon" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#176BFF" stop-opacity="0.085"/>
      <stop offset="100%" stop-color="#176BFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradasi melintang band (sumbu pendek) supaya tepinya luruh halus,
         bukan memotong sebagai garis lurus. -->
    <linearGradient id="skBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FB8FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8FB8FF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8FB8FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="skBandFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="skBandMask">
      <ellipse cx="500" cy="560" rx="1500" ry="420" fill="url(#skBandFade)"/>
    </mask>

    <!-- Planet: disinari dari kiri-atas, sisi kanan-bawah gelap -->
    <radialGradient id="skPlanet" cx="34%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#5B8FE0" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#2C5AA8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#0A1533" stop-opacity="0.22"/>
    </radialGradient>
    <radialGradient id="skPlanetHalo" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#3E7BD6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3E7BD6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="skPlanetClip">
      <circle cx="792" cy="236" r="62"/>
    </clipPath>

    <filter id="skGlow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="skSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- ── Nebula & cahaya langit ── -->
  <ellipse cx="250" cy="220" rx="430" ry="360" fill="url(#skNebulaA)"/>
  <ellipse cx="820" cy="760" rx="400" ry="380" fill="url(#skNebulaB)"/>
  <rect x="0" y="700" width="1000" height="500" fill="url(#skHorizon)"/>

  <!-- ── Pita bima sakti ── -->
  <g transform="rotate(-52 500 560)" mask="url(#skBandMask)">
    <ellipse cx="500" cy="560" rx="1500" ry="190" fill="url(#skBand)"/>
    <ellipse cx="500" cy="560" rx="1500" ry="88" fill="url(#skBand)" opacity="0.75"/>
  </g>

